# Local development: `docker compose up` starts Postgres + Django on http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sukidle
      POSTGRES_USER: sukidle
      POSTGRES_PASSWORD: sukidle
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sukidle -d sukidle"]
      interval: 2s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://sukidle:sukidle@db:5432/sukidle
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
