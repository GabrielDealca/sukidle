name: CI

on:
  pull_request:
  push:
    branches: [main, production]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sukidle
          POSTGRES_USER: sukidle
          POSTGRES_PASSWORD: sukidle
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sukidle"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://sukidle:sukidle@localhost:5432/sukidle
      DJANGO_SETTINGS_MODULE: config.settings.test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: pytest

  # The frontend job is added in Phase 3 when frontend/ exists.
